{% extends "base.html" %}
{% block title %}Redefinir senha{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Redefinir senha de {{ usuario_alvo.username }}</h1>
<div class="row"><div class="col-lg-5">
  <div class="card"><div class="card-body">
    <form method="post" novalidate data-evitar-duplo-envio>
      {% csrf_token %}
      {% include "partials/form_corpo.html" with coluna="col-12" %}
      <div class="d-flex gap-2 mt-3">
        <button type="submit" class="btn btn-primary">Redefinir senha</button>
        <a class="btn btn-outline-secondary" href="{% url 'accounts:usuario_list' %}">Cancelar</a>
      </div>
    </form>
  </div></div>
</div></div>
{% endblock %}
