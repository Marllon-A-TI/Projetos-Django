<form method="get" class="card card-body mb-3 d-print-none">
  <div class="row g-2 align-items-end">
    {% for campo in filtro.visible_fields %}
      {% if campo.name != ocultar %}
      <div class="col-12 col-sm-6 col-lg-3 col-xl-2">
        {% if campo.widget_type == "checkbox" %}
        <div class="form-check mb-2">
          {{ campo }}
          <label class="form-check-label" for="{{ campo.id_for_label }}">{{ campo.label }}</label>
        </div>
        {% else %}
        <label class="form-label small mb-1" for="{{ campo.id_for_label }}">{{ campo.label }}</label>
        {{ campo }}
        {% endif %}
        {% for erro in campo.errors %}<div class="invalid-feedback d-block">{{ erro }}</div>{% endfor %}
      </div>
      {% endif %}
    {% endfor %}
    <div class="col-12 col-sm-auto d-flex gap-2">
      <button type="submit" class="btn btn-primary">Filtrar</button>
      <a href="{{ request.path }}" class="btn btn-outline-secondary">Limpar</a>
    </div>
  </div>
</form>
