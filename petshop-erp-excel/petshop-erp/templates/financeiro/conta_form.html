{% extends "base.html" %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
<h1 class="h3 mb-3">{{ titulo }}</h1>
<div class="card"><div class="card-body">
  <form method="post" novalidate data-evitar-duplo-envio>
    {% csrf_token %}
    {% include "partials/form_corpo.html" %}
    <div class="d-flex gap-2 mt-4">
      <button type="submit" class="btn btn-primary">Salvar</button>
      <a class="btn btn-outline-secondary" href="{{ voltar_url }}">Cancelar</a>
    </div>
  </form>
</div></div>
{% endblock %}
