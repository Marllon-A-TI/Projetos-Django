{% include "partials/form_erros.html" %}
<div class="row g-3">
  {% for campo in form %}
    {% if campo.is_hidden %}
      {{ campo }}
    {% else %}
    <div class="{% if campo.widget_type == 'textarea' %}col-12{% else %}{{ coluna|default:'col-md-6' }}{% endif %}">
      {% include "partials/campo.html" %}
    </div>
    {% endif %}
  {% endfor %}
</div>
